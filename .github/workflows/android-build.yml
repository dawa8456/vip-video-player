name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-pip zip unzip openjdk-17-jdk build-essential ccache coreutils
          python3 -m pip install --upgrade pip setuptools wheel

      - name: Install buildozer
        run: |
          python3 -m pip install --user buildozer==1.6.0
          export PATH="$HOME/.local/bin:$PATH"
          buildozer --version

      - name: Build APK (debug)
        env:
          PATH: ${{ github.workspace }}:$HOME/.local/bin:$PATH
        run: |
          buildozer android debug >/tmp/buildozer.log 2>&1 || { python3 - <<'PY'
          print(open('/tmp/buildozer.log','rb').read().decode(errors='replace'))
          PY
          exit 1; }

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-apk
          path: bin/*.apk
