name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 拉取代码
        uses: actions/checkout@v4

      - name: 2. 借助 Docker 运行 Buildozer 自动编译
        uses: addnab/docker-run-action@v3
        with:
          image: kivy/buildozer:latest
          options: >-
            --workdir /home/user/hostcwd
            -v ${{ github.workspace }}:/home/user/hostcwd
          run: |
            # 强行注入环境变量，防止云端 root 权限弹框死锁
            export BUILDOZER_ALLOW_KIVY_BUILD_FROM_ROOT=1
            
            # 清理历史缓存并使用管道强行应答可能出现的 y/n 提问
            buildozer android clean || true
            yes | buildozer -v android debug

      - name: 3. 上传导出的 APK 成果物
        uses: actions/upload-artifact@v4
        with:
          name: Android-VIP-Player
          path: bin/*.apk